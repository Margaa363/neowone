    <link rel="stylesheet" href="bulma.css" />
    <section class="section">
      <h1 id="item">Idevhej</h1>
      <button onclick="activate()" class="button">Activate</button>
      <button onclick="deactivate()" class="button">Deactivate</button>
    </section>
    <script>
      const title = document.getElementById("item");
      const activate = () => {
        title.classList.add("active");
      };
      const deactivate = () => {
        title.classList.remove("active");
      };
    </script>
